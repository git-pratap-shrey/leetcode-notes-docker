services:
  n8n:
    image: pratapshrey/leetcode-notes:latest
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=n8n.git-pratap-shrey.online
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://n8n.git-pratap-shrey.online/
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - N8N_PROXY_HOPS=1
      # - N8N_SECURE_COOKIE=false
    volumes:
      - /home/anon/n8n-docker/.n8n:/home/node/.n8n
